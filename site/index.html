<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FairRound — the on-chain IPO exchange for crypto projects</title>
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="FairRound is the on-chain IPO exchange for crypto projects, on Arbitrum One: every listing round clears at one price, small buyers get filled, and the raise sits in a treasury only holders can spend. Live as a demo with free test credits." />
    <link rel="canonical" href="https://fairround.xyz/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FairRound" />
    <meta property="og:description" content="FairRound is the on-chain IPO exchange for crypto projects, on Arbitrum One: every listing round clears at one price, small buyers get filled, and the raise sits in a treasury only holders can spend. Live as a demo with free test credits." />
    <meta property="og:url" content="https://fairround.xyz/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="FairRound" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FairRound" />
    <meta name="twitter:description" content="FairRound is the on-chain IPO exchange for crypto projects, on Arbitrum One: every listing round clears at one price, small buyers get filled, and the raise sits in a treasury only holders can spend. Live as a demo with free test credits." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data. Deliberately NOT typed as a FinancialProduct or
         InvestmentOrDeposit schema — that would contradict the site's own
         honest disclaimer that this is a demo with test credits, not a real
         financial product. WebApplication + a Game category is the
         accurate description of what this actually is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FairRound",
        "description": "FairRound is the on-chain IPO exchange for crypto projects, on Arbitrum One: every listing round clears at one price, small buyers get filled, and the raise sits in a treasury only holders can spend. Live as a demo with free test credits.",
        "url": "https://fairround.xyz/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any (web browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "inLanguage": ["en", "ka"],
        "sameAs": [
          "https://x.com/investtoken1",
          "https://www.reddit.com/r/sakartveloexchange/",
          "https://t.me/sakartvelo_exchange",
          "https://t.me/sakartveloexchange"
        ]
      }
    </script>
    <!-- Google Analytics is loaded dynamically, only after consent, via
         the ConsentBanner component — not unconditionally here. See
         src/components/ConsentBanner.jsx. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
